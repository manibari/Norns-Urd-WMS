# Every push and pull request: format, lint, test on Linux (fast feedback),
# then build and test the real target — Windows — and keep the exe as an
# artifact so any commit can be tried on the tablet.
name: CI

on:
  push:
    branches: [main, rust-rewrite]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt · clippy · test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: build · test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p urdwms
      - uses: actions/upload-artifact@v4
        with:
          name: urdwms-windows-${{ github.sha }}
          path: target/release/urdwms.exe
          retention-days: 14
