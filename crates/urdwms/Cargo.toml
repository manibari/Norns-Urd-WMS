[package]
name = "urdwms"
description = "Urd-WMS desktop app: receiving, image-recognised issuing, FIFO, traceability, alerts"
version.workspace = true
edition.workspace = true

[[bin]]
name = "urdwms"
path = "src/main.rs"

[dependencies]
urdwms-core = { path = "../urdwms-core" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "accesskit", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["datepicker"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
jiff = "0.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
getrandom = "0.3"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

